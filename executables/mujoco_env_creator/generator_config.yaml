num_configs: 5000
config_dir: 'resources/input_files/cylinder_envs/single_pair_arc'
output_dir: 'resources/models/cylinder_envs/single_pair_arc'

wall:
  thickness: 0.05
  color: [0.8, 0.8, 0.8, 1]
  condim: 4

obstacles:
  placement_strategy: "single_pair_arc"  # Options: "single_pair_arc", "multi_movable_arc", "quadrant_mixed"
  
  # For multi_movable_arc strategy
  num_movable: 3  # Number of movable objects when using multi_movable_arc
  
  # For quadrant_mixed strategy
  count:
    min: 2  # Minimum total obstacles
    max: 6  # Maximum total obstacles
  movable_probability: 0.6  # Probability of an obstacle being movable (0-1)
  
  # Common obstacle configurations
  size:
    width:
      min: 0.1
      max: 1.0
    depth:
      min: 0.1
      max: 1.0
  movable_mass: 0.1
  color:
    movable: [1, 1, 0, 1]
    static: [1, 0, 0, 1]
  friction: [0.0, 0.005, 0.001]
  num_movable: 3
  movable_probability: 0.6

env_size:
  width: # corridor width
    min: 2
    max: 4
  depth:
    min: 2
    max: 4
  height:
    min: 2
    max: 2

robot:
  size: [0.3, 0.14, 0.2]
  mass: 5.0
  color: [1.0, 1.0, 0.0, 1.0]
  friction: [1.0, 0.005, 0.0001]

floor:
  friction: [0.5, 0.005, 0.001]
  size: [0, 0, 0.05]

light:
  pos: [0, 0, 1.5]
  dir: [0, 0, -1]

skybox:
  rgb1: [0.3, 0.5, 0.7]
  rgb2: [0, 0, 0]
  width: 512
  height: 3072

groundplane:
  rgb1: [0.2, 0.3, 0.4]
  rgb2: [0.1, 0.2, 0.3]
  markrgb: [0.8, 0.8, 0.8]
  width: 300
  height: 300
  texrepeat: [5, 5]
  reflectance: 0.2
