random_seed: 210896
simulation_step: 0.1

plant: !file "plants/car_like.yaml"

use_learned_controller: true
learned_controller: !file "networks/car_like_controller.yaml"

random_local_goal: false
planner_name: "roadmap"
goal_radius: 0.5

num_trajectories: 100
sample_around: true
verify_edge: true
validate: true
num_failures: 100
stretch_factor: 2.0
termination_classifier: !file "networks/svm_classifier.yaml"

environment: "environments/landmark.yaml"
start_state: [-8.0, 0.0,0.00,0.0000,0.0000]
goal_state:  [ 8.0, 0.0,0.00,0.0000,0.0000]
output_dir: "ablation/"
roadmap_dir: "ablation/roadmap_sparse/"

