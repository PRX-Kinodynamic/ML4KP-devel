random_seed: 210896
simulation_step: 0.1

plant: !file "plants/treaded_vehicle.yaml"

use_learned_controller: true
learned_controller: !file "networks/treaded_vehicle_controller.yaml"

random_local_goal: true
planner_name: "rlg"
goal_radius: 0.5

# These are related to a classifier-based roadmap. Ignore for now.
num_trajectories: 100
sample_around: true
verify_edge: true
validate: true
num_failures: 100
stretch_factor: 2.0
termination_classifier: !file "networks/svm_classifier.yaml"

