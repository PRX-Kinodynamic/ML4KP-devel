random_seed: 210896
# random_seed: 101193
simulation_step: 0.1

# "environments/bar.yaml"
# "environments/indoor.yaml"
environment: "environments/bar.yaml"

plant: !file "plants/forward_car_like.yaml"

use_learned_controller: true
learned_controller: !file "networks/forward_car_like_controller.yaml"

random_local_goal: false
planner_name: "roadmap"
goal_radius: 0.5

num_trajectories: 100
sample_around: true
verify_edge: true
validate: true
num_failures: 10
collect_reachability: true
stretch_factor: 3.0
termination_classifier: !file "networks/svm_classifier.yaml"

start_state: [-7.5000,-7.5000, 0.0000, 0.0000, 0.0000]
goal_state:  [ 7.5000, 7.5000, 0.0000, 0.0000, 0.0000]

debug: false

output_dir: "ablation/dc_drrm10/"
roadmap_dir: "ablation/roadmap_medium_3.0/"