environment:
    type: obstacle
    geometries:
      -
        name: upper
        dynamic: false
        collision_geometry: 
          type: box
          material: red 
          dims: [21,.5,.2]      
        config:
          position: [0, 10.25, 0]
          orientation: [0, 0, 0, 1]
