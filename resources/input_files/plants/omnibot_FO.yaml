name: "omnirobot_FO"
path: "omnirobot_FO"

# Assume simple_obstacle environment
start_state: [0.0, 0.0, 0.0]
goal_state:  [20.0, 20.0, 0.0]

min_steps: 1
max_steps: 50

state_space_lower_bound: [-30, -30, -3.1415]
state_space_upper_bound: [30, 30, 3.14159]

vis_body: "body"

mu_1: &MU_1 1.2166
mu_2: &MU_2 1.1577
mu_3: &MU_3 0.1313
mu_4: &MU_4 1.0015

parameters: [*MU_1, *MU_2, *MU_3, *MU_4]

min_ctrl: &MIN_CTRL -0.2
max_ctrl: &MAX_CTRL 0.2

control_space_lower_bound: [*MIN_CTRL, *MIN_CTRL, *MIN_CTRL, *MIN_CTRL]
control_space_upper_bound: [*MAX_CTRL, *MAX_CTRL, *MAX_CTRL, *MAX_CTRL]
# constant_state: [3.14159, 0, 0, 0]
constant_state: [5, 5, 0]
# constant_state: [0, 0, 0]

# constant_ctrl: [*MAX_CTRL,0,*MIN_CTRL,0] # +X 0
# constant_ctrl: [*MIN_CTRL,0,*MAX_CTRL,0] # -X 1
# constant_ctrl: [0,*MAX_CTRL,0,*MIN_CTRL] # +Y 2
# constant_ctrl: [0,*MIN_CTRL,0,*MAX_CTRL] # -Y 3
# constant_ctrl: [*MAX_CTRL,*MAX_CTRL,*MAX_CTRL,*MAX_CTRL] # +Rot 4
# constant_ctrl: [*MIN_CTRL,*MIN_CTRL,*MIN_CTRL,*MIN_CTRL] # -Rot 5
# constant_ctrl: [*MAX_CTRL,*MAX_CTRL,*MIN_CTRL,*MIN_CTRL] # Diag: +X+Y 6
# constant_ctrl: [*MIN_CTRL,*MIN_CTRL,*MAX_CTRL,*MAX_CTRL] # Diag: -X-Y 7
# constant_ctrl: [*MAX_CTRL,*MIN_CTRL,*MIN_CTRL,*MAX_CTRL] # Diag: +X-Y 8
# constant_ctrl: [*MIN_CTRL,*MAX_CTRL,*MAX_CTRL,*MIN_CTRL] # Diag: -X+Y 9
# constant_ctrl: [*MIN_CTRL,*MAX_CTRL,*MAX_CTRL,*MIN_CTRL] # Other...
ctrl_duration: 1

error_scale: [1,1,1]

