random_seed: 123456
environment: "mushr_indoors.xml"
runs: 1
duration: 60
poll_rate: 0.5

plant: !file "plants/mushr.yaml"
learned_controller: !file "networks/mushr.yaml"

planner_name: "roadmap"
random_local_goal: false
goal_radius: 0.5

num_trajectories: 100
sample_around: true
verify_edge: true
validate: true
num_failures: 100
stretch_factor: 2.0


goal_state: [-9.0,-5.0,0.0,0.0,0.0]
start_state: [9.0,5.0,0.0,0.0,0.0]


output_dir: "ablation/indoors/"
roadmap_dir: "roadmaps/indoors/"



