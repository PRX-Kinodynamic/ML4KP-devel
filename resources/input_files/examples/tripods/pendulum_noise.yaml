random_seed: 11101993
simulation_step: 0.01

environment: "environments/empty.yaml"
plant: !file "plants/pendulum.yaml"

goal_region_radius: 0.5

controller_path: "examples/tripods/lc/pendulum.pt"

# The following are new parameters. 
# You can specify "uniform", or "none"
# If you specify "uniform", specify in noise_params the min and max.
x_0_noise: "uniform"
x_0_noise_params: [-0.1,0.1]

f_noise: "uniform"
f_noise_params: [-0.01,0.01]

u_t_noise: "uniform"
u_t_noise_params: [-0.1,0.1]

t_noise: "uniform"
t_noise_params: [-0.5,0.5]

duration: 5
state_increment: 0.1
system_name: "pendulum_lqr"
