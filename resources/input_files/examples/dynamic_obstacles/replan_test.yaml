planner: "dirt_replan"

random_seed: 21081996
simulation_step: 0.01

# environment: "environments/dynamic.yaml"
environment: "environments/train_dynamic_box/box_0.yaml"
# plant: !file "plants/treaded_vehicle.yaml"
plant: !file "plants/unicycle.yaml"

blossom: 5
pruning: false
prescience: false

planning_time: 2.0
horizon: 5.0
max_replanning_cycles: 30

use_waypoint_predictor: false
waypoint_predictor: !file "networks/treaded_waypoint.yaml"

goal_radius: 0.5

num_trials: 1
output_dir: "dynamic/prescience_test"